name: release

# 打 tag（形如 v1.0）即自动构建两个安装包、校验包内签名、生成校验和并发布 Release。
# 手动触发也可：Actions 页面 -> release -> Run workflow（只构建，不发布）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 校验 manifest 版本与 tag 是否一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MF=$(node -p "require('./extension/manifest.json').version")
          echo "tag=$TAG manifest=$MF"
          if [ "$TAG" != "$MF" ]; then
            echo "::error::tag ($TAG) 与 extension/manifest.json 的 version ($MF) 不一致"
            exit 1
          fi

      - name: 构建（同步内核 + 生成签名 + 打包）
        env:
          SOURCE_DATE_EPOCH: 1760000000
        run: node tools/build.js

      - name: 复核包内签名
        run: node tools/build.js verify

      - name: 生成 SHA256SUMS
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: md-tiny-dist
          path: |
            dist/*.zip
            dist/SHA256SUMS

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
